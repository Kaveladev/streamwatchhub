name: API smoke test (Newman)

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - '.github/workflows/api-smoke.yml'
  schedule:
    - cron: '17 */6 * * *'   # every 6h at :17, offset from Postman monitor
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Skip if secrets missing
        id: check
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ -z "$POSTMAN_API_KEY" ] || [ -z "$RAPIDAPI_KEY" ]; then
            echo "::warning::Skipping — POSTMAN_API_KEY and/or RAPIDAPI_KEY not configured."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install newman
        if: steps.check.outputs.skip != 'true'
        run: npm i -g newman

      - name: Fetch latest collection from Postman
        if: steps.check.outputs.skip != 'true'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          curl -sf -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/collections/55323396-a6493561-bbf6-4b6f-a519-cc49022ad46c" \
            -o collection.json
          test -s collection.json

      - name: Build runtime environment
        if: steps.check.outputs.skip != 'true'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          cat > env.json <<JSON
          {
            "name": "ci",
            "values": [
              {"key": "baseUrl",        "value": "https://streamwatchhub-streaming.p.rapidapi.com", "enabled": true},
              {"key": "X-RapidAPI-Host","value": "streamwatchhub-streaming.p.rapidapi.com",        "enabled": true},
              {"key": "X-RapidAPI-Key", "value": "${RAPIDAPI_KEY}",                                "enabled": true},
              {"key": "country",        "value": "IT",                                             "enabled": true}
            ]
          }
          JSON

      - name: Run newman
        if: steps.check.outputs.skip != 'true'
        run: |
          newman run collection.json -e env.json --reporters cli,json --reporter-json-export newman-result.json --timeout-request 8000

      - name: Upload result artifact
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newman-result
          path: newman-result.json
          retention-days: 14
